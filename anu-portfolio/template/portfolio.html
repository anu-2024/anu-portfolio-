<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS (colours are injected from portfolio_data.py) ============ */
:root{
  --bg:#0C1024; --panel:#151B3B; --text:#EEF0FF; --muted:#9AA3C7;
  --accent:#8C7BFF; --accent2:#4FE3D0; --line:rgba(160,170,230,.18);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:1.0625rem;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:6px}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .4s}
#app{position:relative;z-index:1}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.js .rv{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .rv.show{opacity:1;transform:none}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}
section{padding:112px 0}
h1,h2,h3{font-family:var(--display);line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:700;text-shadow:0 2px 24px var(--bg)}
.lede{color:var(--muted);max-width:56ch;margin-top:10px;text-shadow:0 2px 18px var(--bg)}
.sec-head{margin-bottom:44px}

/* ============ NAV ============ */
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 0;background:linear-gradient(var(--bg),transparent)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none}
.navlinks{display:flex;gap:22px;font-size:.95rem}
.navlinks a{text-decoration:none;color:var(--muted);padding:4px 2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.navlinks a:hover,.navlinks a.on{color:var(--text);border-color:var(--accent)}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:.98rem;text-decoration:none;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-family:var(--body);transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0C1024}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sm{padding:8px 16px;font-size:.88rem}

/* ============ HERO ============ */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 0 80px}
.hero .copy{max-width:640px}
.hero .hi{font-size:1.2rem;color:var(--accent2);font-weight:500}
.hero h1{font-size:clamp(4rem,12vw,9.5rem);font-weight:800;letter-spacing:-.045em;margin:4px 0 18px;text-shadow:0 6px 60px rgba(140,123,255,.35)}
.hero .headline{font-family:var(--display);font-size:clamp(1.35rem,2.6vw,1.9rem);font-weight:500;line-height:1.25;letter-spacing:-.01em;max-width:24ch}
.hero .sub{color:var(--muted);margin:16px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.socials{display:flex;flex-wrap:wrap;gap:20px;margin-top:34px}
.socials a{color:var(--muted);text-decoration:none;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:2px}
.socials a:hover{color:var(--accent2);border-color:var(--accent2)}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.85rem}
.hero .in{opacity:0;transform:translateY(26px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ============ GLASS CARDS ============ */
.glass{background:color-mix(in srgb,var(--panel) 72%,transparent);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tilt{transform-style:preserve-3d;transition:transform .18s ease-out,border-color .2s;will-change:transform}
.tilt:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}

/* ============ ABOUT ============ */
.about{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center}
.photo{padding:12px;border-radius:28px}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}
.about p{margin-bottom:16px;max-width:62ch}
.about p.sum{font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.stat{padding:16px 14px}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1;color:var(--accent2)}
.stat span{font-size:.85rem;color:var(--muted);line-height:1.3;display:block;margin-top:6px}
.avail{margin-top:22px;padding:12px 18px;border-left:3px solid var(--accent);color:var(--muted)}

/* ============ SKILLS ============ */
.toolkit{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:stretch}
.tabs{display:grid;gap:10px;align-content:start}
.tab{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 20px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 55%,transparent);color:var(--muted);font:inherit;font-weight:500;cursor:pointer;position:relative;overflow:hidden;transition:color .2s,border-color .2s,background .2s,transform .2s}
.tab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));transform:scaleY(0);transition:transform .25s}
.tab:hover{color:var(--text);transform:translateX(3px)}
.tab[aria-selected="true"]{color:var(--text);border-color:color-mix(in srgb,var(--accent) 65%,transparent);background:color-mix(in srgb,var(--panel) 90%,transparent)}
.tab[aria-selected="true"]::before{transform:scaleY(1)}
.tab small{font-size:.82rem;color:var(--accent2)}
.tpanel{padding:30px;min-height:340px}
.tpanel h3{font-size:1.5rem;margin-bottom:4px}
.tpanel .tcount{color:var(--muted);font-size:.95rem;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;opacity:0;transform:translateY(14px) rotateX(-18deg);animation:tileIn .5s cubic-bezier(.2,.7,.2,1) forwards;transition:border-color .2s,background .2s}
.tile:hover{border-color:var(--accent2);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tile::after{content:"";display:block;width:22px;height:3px;border-radius:3px;margin-top:10px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@keyframes tileIn{to{opacity:1;transform:none}}

/* ============ TIMELINE (experience is a real sequence) ============ */
.timeline{position:relative;display:grid;gap:22px;padding-left:34px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),var(--accent2));opacity:.6}
.item{position:relative;padding:24px 28px}
.item::before{content:"";position:absolute;left:-34px;top:32px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--accent2)}
.item h3{font-size:1.35rem}
.item .org{color:var(--accent2);font-weight:500;margin-top:2px}
.item .when{color:var(--muted);font-size:.92rem;margin:4px 0 12px}
.item .lnk{display:inline-block;margin-top:12px}
.item ul{padding-left:20px;color:var(--text)}
.item li{margin-bottom:6px;max-width:70ch}

/* ============ PROJECTS ============ */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;perspective:1200px}
.card{padding:30px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.card h3{font-size:1.5rem}
.card p{color:var(--muted);flex:1}
.card .btns{display:flex;gap:10px;flex-wrap:wrap}

/* ============ EDUCATION / CERTS / ACHIEVEMENTS ============ */
.edu{display:grid;gap:16px}
.edu .row{padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:6px 24px}
.edu h3{font-size:1.2rem}
.edu .sch{color:var(--muted)}
.edu .sc{text-align:right}
.edu .sc b{display:block;color:var(--accent2);font-family:var(--display)}
.edu .sc span{color:var(--muted);font-size:.9rem}
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cert{padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:128px}
.cert b{font-family:var(--display);font-size:1.05rem;line-height:1.25}
.cert span{color:var(--muted);font-size:.92rem}
.cert .go{color:var(--accent2);font-weight:700;font-size:.9rem;text-decoration:none;border-bottom:1px solid transparent;align-self:flex-start}
.cert .go:hover{border-color:var(--accent2)}
.cert .row{display:flex;flex-direction:column;gap:4px}
.ach{padding:28px 32px}
.ach h3{font-size:1.4rem;margin-bottom:8px}
.ach p{color:var(--muted);max-width:68ch}

/* ============ CONTACT ============ */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.bigmail{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.6rem);letter-spacing:-.02em;word-break:break-word;text-decoration:none;display:inline-block;margin:6px 0 18px}
.bigmail:hover{color:var(--accent2)}
.meta{color:var(--muted);font-size:1.05rem}
.pin{display:inline-flex;align-items:center;gap:8px}
.pin::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent2) 25%,transparent)}
.meta a{text-decoration:none;border-bottom:1px solid var(--line)}
form{padding:26px;display:grid;gap:14px}
label{font-size:.9rem;color:var(--muted);display:grid;gap:6px}
input,textarea{font:inherit;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
#contact{padding-bottom:140px}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
  section{padding:84px 0}
  .navlinks{display:none}
  .about,.toolkit,.contact{grid-template-columns:1fr}
  .tabs{grid-template-columns:repeat(2,1fr)}
  .about{gap:32px}.photo{max-width:320px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.certs{grid-template-columns:1fr}
  .edu .row{grid-template-columns:1fr}.edu .sc{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero .in{animation:none;opacity:1;transform:none}
  .tilt{transition:none}
  .js .rv{opacity:1;transform:none;transition:none}
  .tile{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="progress"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Content is injected by app.py from portfolio_data.py */
const DATA = /*__DATA__*/null;
</script>
<script>
(function(){
"use strict";
const D = DATA;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const touch = matchMedia("(pointer: coarse)").matches;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- theme ---------- */
const rs = document.documentElement.style;
Object.entries(D.theme).forEach(([k,v]) => rs.setProperty("--"+k, v));
document.title = D.title;

/* ---------- section builders ---------- */
const P = D.profile;
const sections = [];   // {id,label,html}

function add(id, label, html){ if(html) sections.push({id,label,html}); }

const head = (title, lede) => `<div class="sec-head"><h2>${esc(title)}</h2>${lede?`<p class="lede">${esc(lede)}</p>`:""}</div>`;

/* About */
add("about","About", `
<section id="about"><div class="wrap about">
  ${D.photo ? `<div class="photo glass tilt"><img src="${D.photo}" alt="Portrait of ${esc(P.name)}"></div>` : ""}
  <div>
    <h2>About me</h2>
    <p class="sum" style="margin-top:18px">${esc(P.summary)}</p>
    ${(P.about||[]).map(t=>`<p>${esc(t)}</p>`).join("")}
    <div class="stats">${(D.stats||[]).map(s=>`<div class="stat glass"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>
    ${P.available_for ? `<p class="avail">${esc(P.available_for)}</p>`:""}
  </div>
</div></section>`);

/* Skills -> interactive Toolkit */
const groups = Object.entries(D.skillGroups||{});
if(groups.length) add("skills","Toolkit", `
<section id="skills"><div class="wrap">
  ${head("Toolkit","Pick a category to see the languages, frameworks and tools I work with.")}
  <div class="toolkit">
    <div class="tabs" role="tablist" aria-label="Skill categories">${groups.map(([g,items],i)=>`<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i===0}">${esc(g)}<small>${items.length}</small></button>`).join("")}</div>
    <div class="tpanel glass tilt" id="tpanel" role="tabpanel"></div>
  </div>
</div></section>`);

/* Experience */
if((D.experience||[]).length) add("experience","Experience", `
<section id="experience"><div class="wrap">
  ${head("Experience","Internships and teaching roles, newest first.")}
  <div class="timeline">${D.experience.map(e=>`
    <article class="item glass"><h3>${esc(e.role)}</h3>
      <div class="org">${esc(e.org)}</div>
      <div class="when">${esc(e.period)}${e.place?`, ${esc(e.place)}`:""}</div>
      <ul>${(e.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      ${e.link?`<a class="btn sm lnk" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.link_label||"View certificate")}</a>`:""}</article>`).join("")}
  </div>
</div></section>`);

/* Projects */
if((D.projects||[]).length) add("projects","Projects", `
<section id="projects"><div class="wrap">
  ${head("Projects","Things I've built. Hover a card to tilt it.")}
  <div class="grid2">${D.projects.map(p=>`
    <article class="card glass tilt"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
      <div class="chips">${(p.stack||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>
      <div class="btns">
        ${p.github?`<a class="btn sm" href="${esc(p.github)}" target="_blank" rel="noopener">View code</a>`:""}
        ${p.demo?`<a class="btn sm primary" href="${esc(p.demo)}" target="_blank" rel="noopener">Open live app</a>`:""}
      </div></article>`).join("")}
  </div>
</div></section>`);

/* Education */
if((D.education||[]).length) add("education","Education", `
<section id="education"><div class="wrap">
  ${head("Education")}
  <div class="edu">${D.education.map(e=>`
    <div class="row glass"><div><h3>${esc(e.degree)}</h3><div class="sch">${esc(e.school)}</div></div>
    <div class="sc"><b>${esc(e.period)}</b><span>${esc(e.score||"")}</span></div></div>`).join("")}
  </div>
</div></section>`);

/* Certifications */
if((D.certifications||[]).length) add("certifications","Certifications", `
<section id="certifications"><div class="wrap">
  ${head("Certifications")}
  <div class="certs">${D.certifications.map(c=>`<div class="cert glass tilt"><div class="row"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>${c[2]?`<a class="go" href="${esc(c[2])}" target="_blank" rel="noopener">View certificate</a>`:""}</div>`).join("")}</div>
</div></section>`);

/* Achievements */
if((D.achievements||[]).length) add("leadership","Leadership", `
<section id="leadership"><div class="wrap">
  ${head("Leadership")}
  <div class="edu">${D.achievements.map(a=>`<div class="ach glass"><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div>`).join("")}</div>
</div></section>`);

/* Contact */
add("contact","Contact", `
<section id="contact"><div class="wrap">
  ${head("Let's talk", P.available_for || "")}
  <div class="contact">
    <div>
      <a class="bigmail" href="mailto:${esc(P.email)}">${esc(P.email)}</a>
      <div class="meta">${P.location?`<span class="pin">Based in ${esc(P.location)}</span>`:""}</div>
    </div>
    <form class="glass" id="mailform">
      <label>Your name<input name="n" required autocomplete="name"></label>
      <label>Your email<input name="e" type="email" required autocomplete="email"></label>
      <label>Message<textarea name="m" required></textarea></label>
      <button class="btn primary" type="submit">Open in my email app</button>
    </form>
  </div>
</div></section>`);

/* Hero (always first) */
const hero = `
<header class="hero" id="top"><div class="wrap"><div class="copy">
  <p class="hi in" style="animation-delay:.1s">${esc(P.greeting||"Hi, I'm")}</p>
  <h1 class="in" style="animation-delay:.25s">${esc(P.name)}</h1>
  <p class="headline in" style="animation-delay:.45s">${esc(P.headline)}</p>
  <p class="sub in" style="animation-delay:.6s">${esc(P.subline||"")}</p>
  <div class="cta in" style="animation-delay:.75s">
    ${(D.projects||[]).length?`<a class="btn primary" href="#projects">See my projects</a>`:""}
    ${D.resumeB64?`<button class="btn" id="dl" type="button">Download resume</button>`:""}
    <a class="btn" href="#contact">Contact me</a>
  </div>
  <div class="socials in" style="animation-delay:.9s">${(D.links||[]).map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("")}</div>
</div></div><div class="hint">Move your mouse over the 3D model</div></header>`;

const nav = `<nav><div class="wrap"><a class="brand" href="#top">${esc(P.name)}</a>
  <div class="navlinks">${sections.filter(s=>s.id!=="contact").map(s=>`<a href="#${s.id}" data-s="${s.id}">${esc(s.label)}</a>`).join("")}
  <a href="#contact" data-s="contact">Contact</a></div></div></nav>`;

$("#app").innerHTML = nav + hero + sections.map(s=>s.html).join("") ;

/* ---------- interactions ---------- */
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{
  const t = document.getElementById(a.getAttribute("href").slice(1));
  if(t){ e.preventDefault(); t.scrollIntoView({behavior: reduce?"auto":"smooth"}); }
}));

const dl = $("#dl");
if(dl) dl.addEventListener("click", ()=>{
  const bin = atob(D.resumeB64), u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8],{type:"application/pdf"}));
  const a = document.createElement("a"); a.href=url; a.download=D.resumeName||"resume.pdf";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
});

const form = $("#mailform");
if(form) form.addEventListener("submit", e=>{
  e.preventDefault();
  const f = new FormData(form);
  const body = `${f.get("m")}\n\n${f.get("n")}\n${f.get("e")}`;
  const a = document.createElement("a");
  a.href = `mailto:${P.email}?subject=${encodeURIComponent("Portfolio enquiry from "+f.get("n"))}&body=${encodeURIComponent(body)}`;
  a.target = "_blank"; document.body.appendChild(a); a.click(); a.remove();
});

/* active nav link */
const links = [...document.querySelectorAll(".navlinks a")];
const io = new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting) links.forEach(l=>l.classList.toggle("on", l.dataset.s===en.target.id));
}),{rootMargin:"-45% 0px -50% 0px"});
sections.forEach(s=>{const n=document.getElementById(s.id); if(n) io.observe(n);});

/* 3D card tilt */
if(!reduce && !touch){
  document.querySelectorAll(".tilt").forEach(c=>{
    c.addEventListener("pointermove",e=>{
      const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      c.style.transform=`perspective(900px) rotateX(${(-y*9).toFixed(2)}deg) rotateY(${(x*11).toFixed(2)}deg) translateZ(6px)`;
    });
    c.addEventListener("pointerleave",()=>{c.style.transform="";});
  });
}

/* ---------- Toolkit tabs ---------- */
(function(){
  const panel=$("#tpanel"); if(!panel) return;
  const tabs=[...document.querySelectorAll(".tab")], entries=Object.entries(D.skillGroups);
  function show(i){
    tabs.forEach((t,k)=>t.setAttribute("aria-selected",k===i));
    const [g,items]=entries[i];
    panel.innerHTML=`<h3>${esc(g)}</h3><p class="tcount">${items.length} ${items.length===1?"skill":"skills"}</p>
      <div class="tiles">${items.map((x,k)=>`<div class="tile" style="animation-delay:${k*55}ms">${esc(x)}</div>`).join("")}</div>`;
  }
  tabs.forEach((t,i)=>{
    t.addEventListener("click",()=>show(i));
    t.addEventListener("keydown",e=>{
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=(i+(e.key==="ArrowDown"?1:-1)+tabs.length)%tabs.length;tabs[n].focus();show(n);}
    });
  });
  show(0);
})();

/* ---------- reveal on scroll + progress bar ---------- */
(function(){
  const bar=$("#progress");
  function p(){const m=document.documentElement.scrollHeight-innerHeight;bar.style.width=(m>0?scrollY/m*100:0)+"%";}
  addEventListener("scroll",p,{passive:true}); p();
  if(reduce||!("IntersectionObserver" in window)) return;
  document.documentElement.classList.add("js");
  const els=document.querySelectorAll("section .sec-head,section .glass:not(.tpanel),section .about h2,section .about p");
  const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add("show");ro.unobserve(t);setTimeout(()=>{t.classList.remove("rv","show");t.style.transitionDelay="";},1100);}}),{threshold:.08});
  els.forEach((el,i)=>{el.classList.add("rv");el.style.transitionDelay=(i%4)*70+"ms";ro.observe(el);});
})();

/* ---------- Three.js hero scene (fixed behind the page) ---------- */
(function(){
  if(!window.THREE) return;                       // CDN blocked: page still works, just without 3D
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:$("#bg"), alpha:true, antialias:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50,1,.1,100); camera.position.z = 8;
  const cA = new THREE.Color(D.theme.accent), cB = new THREE.Color(D.theme.accent2);

  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const l1 = new THREE.PointLight(cA,2.2,40); l1.position.set(5,4,6); scene.add(l1);
  const l2 = new THREE.PointLight(cB,2.0,40); l2.position.set(-5,-3,5); scene.add(l2);

  const rig = new THREE.Group(); scene.add(rig);      // follows mouse + scroll
  const core = new THREE.Group(); rig.add(core);      // spins on its own

  // outer wire shell + vertex nodes
  const shellGeo = new THREE.IcosahedronGeometry(2.1,1);
  core.add(new THREE.LineSegments(new THREE.WireframeGeometry(shellGeo),
    new THREE.LineBasicMaterial({color:cA,transparent:true,opacity:.55})));
  core.add(new THREE.Points(shellGeo,new THREE.PointsMaterial({color:cB,size:.11,sizeAttenuation:true})));

  // inner faceted gem
  const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,0),
    new THREE.MeshStandardMaterial({color:cA,metalness:.7,roughness:.22,flatShading:true}));
  core.add(gem);

  // orbit rings with satellites
  const rings = [];
  [[3.0,.35,0],[3.5,-.9,.6]].forEach(([r,rx,rz],i)=>{
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.TorusGeometry(r,.014,8,180),new THREE.MeshBasicMaterial({color:i?cA:cB,transparent:true,opacity:.6})));
    for(let k=0;k<3;k++){
      const m = new THREE.Mesh(new THREE.SphereGeometry(.1,16,16),new THREE.MeshBasicMaterial({color:0xffffff}));
      const a = k*Math.PI*2/3; m.position.set(Math.cos(a)*r,Math.sin(a)*r,0); g.add(m);
    }
    g.rotation.set(rx,0,rz); rig.add(g); rings.push(g);
  });

  // star field
  const N = 900, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r = 9+Math.random()*22, t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.sin(p)*Math.sin(t); pos[i*3+2]=r*Math.cos(p);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const stars = new THREE.Points(sg,new THREE.PointsMaterial({color:0xaab4ff,size:.06,transparent:true,opacity:.7}));
  scene.add(stars);

  function resize(){
    const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  addEventListener("resize",resize); resize();

  let mx=0,my=0,sp=0;
  addEventListener("pointermove",e=>{ mx=e.clientX/innerWidth*2-1; my=e.clientY/innerHeight*2-1; });
  function onScroll(){
    const max = document.documentElement.scrollHeight - innerHeight;
    sp = max>0 ? scrollY/max : 0;
    $("#bg").style.opacity = Math.max(.42, 1 - sp*9).toFixed(2);
  }
  addEventListener("scroll",onScroll,{passive:true}); onScroll();

  const clock = new THREE.Clock();
  function tick(){
    const t = clock.getElapsedTime(), narrow = innerWidth<900;
    const tx = narrow ? 0 : 2.6*Math.cos(sp*Math.PI*4);      // drifts right → left → right while scrolling
    const ty = narrow ? 2.0 - sp*2 : Math.sin(sp*Math.PI*3)*.8;
    const sc = narrow ? .62 : 1;
    rig.position.x += (tx-rig.position.x)*.05;
    rig.position.y += (ty-rig.position.y)*.05;
    rig.scale.setScalar(rig.scale.x + (sc-rig.scale.x)*.05);
    rig.rotation.y += (mx*.6 - rig.rotation.y)*.05;
    rig.rotation.x += (my*.35 - rig.rotation.x)*.05;
    if(!reduce){
      core.rotation.y = t*.18 + sp*6; core.rotation.x = t*.07;
      gem.rotation.y = -t*.4; gem.rotation.z = t*.2;
      rings[0].rotation.z = t*.12;
      rings[1].rotation.z = .6 - t*.09;
      stars.rotation.y = t*.008;
      gem.scale.setScalar(1 + Math.sin(t*1.4)*.04);
    }
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
})();
</script>
